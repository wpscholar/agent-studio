name: Release
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ZIP: build/agent-studio-${{ github.ref_name }}.zip
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: '.nvmrc', cache: 'npm' }
      # Sites compare this tag with the installed plugin's header Version, so
      # every version string in the repo must already match it.
      - name: Check the tag matches the plugin version
        run: node scripts/verify-release.mjs version "$GITHUB_REF_NAME"
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', tools: 'composer:v2' }
      - run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
      - run: npm ci
      - run: npm run build
      - run: npm run package
      # The updater installs this exact zip, so check it is a complete plugin.
      - name: Check the release zip
        run: node scripts/verify-release.mjs zip "$GITHUB_REF_NAME" "$ZIP"
      - uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.ZIP }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          # Tags like 2.0.0-rc.1 are pre-releases; sites only update to full releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
