name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: '.nvmrc', cache: 'npm' }
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', tools: 'composer:v2', coverage: none }
      - run: composer install --prefer-dist --no-interaction
      - run: npm ci
      - run: composer lint
      - run: npm run lint
      - run: npm run format:check
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', tools: 'composer:v2' }
      - run: composer install --prefer-dist --no-interaction
      - run: composer analyze
  # Runs in the same devcontainer as local development. The compose file reads
  # WP_VERSION and PHP_VERSION, and post-create.sh installs WordPress and the
  # test scaffolding before the tests run.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        wp: ['7.0', '7.1']
        php: ['8.2', '8.3', '8.4', '8.5']
    env:
      WP_VERSION: ${{ matrix.wp }}
      PHP_VERSION: ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v7
      - uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: composer test
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: '.nvmrc', cache: 'npm' }
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', tools: 'composer:v2' }
      - run: composer install --no-dev --prefer-dist --no-interaction
      - run: npm ci
      - run: npm run build
      - run: npm run package
      - uses: actions/upload-artifact@v7
        with: { name: plugin-zip, path: 'build/*.zip', retention-days: 14 }
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: '.nvmrc', cache: 'npm' }
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', tools: 'composer:v2' }
      - run: composer install --prefer-dist --no-interaction
      - run: npm ci
      - run: composer audit
      - run: npm audit --audit-level=high
